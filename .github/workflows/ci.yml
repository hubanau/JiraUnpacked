name: CI

on:
  pull_request:
    branches: [main, develop]

# Minimal token; this workflow only needs to read the repo.
permissions:
  contents: read

# A new push to a PR cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jiraunpacked
          POSTGRES_USER: jiraunpacked
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiraunpacked -d jiraunpacked"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JiraUnpacked.sln

      - name: Build
        run: dotnet build JiraUnpacked.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test JiraUnpacked.sln --configuration Release --no-build --verbosity normal

  image:
    name: Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the deployable image on every PR. This is not busywork: the
      # Dockerfile builds the SPA into wwwroot BEFORE dotnet publish, and
      # UseStaticFiles no-ops on a missing directory — so getting that ordering
      # wrong produces an image that serves a working API with no UI and no
      # error. The build carries a guard for it; this job is what runs the guard.
      - name: Build image
        run: docker build -t jiraunpacked:ci .

      - name: The SPA and the migration bundle are both in the image
        run: |
          docker run --rm --entrypoint sh jiraunpacked:ci -c             'test -f wwwroot/index.html && test -x migrate'

  web:
    name: Web Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/JiraUnpacked.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/JiraUnpacked.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
