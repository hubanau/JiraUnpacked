name: Deploy

# develop -> test, main -> production. Both go through a GitHub Environment, so
# production secrets are never readable from the test job and an approval gate
# can be attached to production without changing this file.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Never cancel a deploy in flight: a half-applied migration is worse than a
# queued deploy. This is the opposite of the CI workflow's setting, on purpose.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC role assumption — no long-lived AWS keys in secrets

jobs:
  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}

    # Skip cleanly until the AWS side exists, rather than failing every merge at
    # the credentials step for a deploy that was never going to work. Setting
    # AWS_DEPLOY_ROLE_ARN activates this workflow with no further edit — a
    # skipped job reads honestly on the branch, a red X does not.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit SHA, never with a moving tag. An immutable tag is
      # what makes a rollback "point the service at the previous SHA" rather than
      # "hope the registry still has what :latest used to mean".
      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Migrations run as a one-off task inside the VPC, using the image just
      # pushed, so the database is never reachable from a GitHub runner.
      #
      # The migration task definition must run the bundle as its entrypoint and
      # supply ConnectionStrings__Default from Secrets Manager as the OWNER role.
      # The app's own role (jiraunpacked_app) is NOBYPASSRLS and deliberately
      # cannot create tables, manage policies, or install extensions — three
      # migrations do exactly those things.
      - name: Apply migrations
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          TASK_DEF: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
          SUBNETS: ${{ vars.ECS_SUBNET_IDS }}
          SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"migrate\",\"image\":\"$IMAGE\"}]}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          # A non-zero exit means a migration failed. Stop here — deploying code
          # against a half-migrated schema is the one outcome worth failing loudly for.
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task exited with $EXIT_CODE" >&2
            exit 1
          fi

      - name: Update the service
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          TASK_DEF: ${{ vars.ECS_TASK_DEFINITION }}
        run: |
          set -euo pipefail
          # Re-register the task definition with the new image, keeping every
          # other field as-is, then point the service at that revision.
          DEF=$(aws ecs describe-task-definition --task-definition "$TASK_DEF" \
            --query 'taskDefinition' --output json)

          NEW_DEF=$(echo "$DEF" | jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)')

          REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$REVISION" >/dev/null

      # The service's container health check should point at /health/ready, which
      # returns 503 while the database is unreachable. That is what makes this
      # wait meaningful: a task that cannot reach RDS never becomes healthy, so a
      # bad deploy fails here instead of silently replacing a working one.
      - name: Wait for the rollout to stabilise
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
